<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fit Area</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    />

  <body>
    <!-- NAVBAR START -->

    <!-- NAVBAR END -->

    <!-- hero start-->
    <section class="hero">
      <div
        class="hero-photo"
        role="img"
        aria-label="Area angkat beban di Fit Area"
      ></div>

      <div class="hero-text">
        <h1>Fit Area</h1>
        <p class="hero-tagline">Latihan serius, tempat yang nyaman.</p>
        <p class="hero-desc">
          Alat lengkap, pelatih bersertifikat, dan buka dari subuh sampai malam.
          Daftar hari ini, mulai latihan besok pagi.
        </p>

        <div class="hero-buttons">
          <a href="#daftar" class="btn btn-primary">Daftar member</a>
          <a href="#coba-gratis" class="btn btn-outline">Coba gratis 1 hari</a>
        </div>

        <!-- Info singkat (ubah sesuai data gym Anda) -->
        <dl class="hero-info">
          <div>
            <dt>Jam buka</dt>
            <dd>05.00–23.00</dd>
          </div>
          <div>
            <dt>Pelatih</dt>
            <dd>12 orang</dd>
          </div>
          <div>
            <dt>Mulai dari</dt>
            <dd>Rp250.000</dd>
          </div>
        </dl>
      </div>
    </section>
    <!-- hero end -->
  </body>
