<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fit Area</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <!-- JADWAL KELAS START -->
    <section class="jadwal" id="jadwal">
      <h2>Jadwal Kelas</h2>
      <p class="sub">Pilih hari untuk melihat kelas yang tersedia</p>

      <div class="filter" id="filter">
        <button class="aktif" data-hari="Semua">Semua</button>
        <button data-hari="Senin">Senin</button>
        <button data-hari="Selasa">Selasa</button>
        <button data-hari="Rabu">Rabu</button>
        <button data-hari="Kamis">Kamis</button>
        <button data-hari="Jumat">Jumat</button>
        <button data-hari="Sabtu">Sabtu</button>
      </div>

      <div class="tabel-wrap">
        <table>
          <thead>
            <tr>
              <th>Hari</th>
              <th>Jam</th>
              <th>Kelas</th>
              <th>Trainer</th>
              <th>Durasi</th>
            </tr>
          </thead>
          <tbody id="isi-jadwal"></tbody>
        </table>
      </div>

      <div class="area-toggle">
        <button class="toggle-jadwal" id="toggle-jadwal" type="button">
          <span class="teks-tombol">Lihat Selengkapnya</span>
          <span class="panah">&#9660;</span>
        </button>
      </div>

      <p class="info-jumlah" id="info-jumlah"></p>
    </section>
    <!-- JADWAL KEALS END -->

    <script src="jadwal.js"></script>
  </body>
</html>
