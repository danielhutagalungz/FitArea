<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fit Area</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* Token Tailwind menunjuk ke CSS variable di style.css (:root),
         jadi warna & font tetap satu sumber. Contoh: bg-aksen = var(--aksen) */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              aksen: "var(--aksen)",
              page: "var(--bg)",
              card: "var(--card)",
              primary: "var(--primary)",
              ink: "var(--font-color)",
              muted: "var(--font-sekunder)",
              line: "var(--line)",
            },
            fontFamily: {
              heading: ["Oswald", "sans-serif"],
              body: ["Roboto", "Arial", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>fit-area</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
